name: Format and test

on:
  push:
  pull_request:

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: master

      - name: Check formatting
        run: zig fmt --check src tests

      - name: Run tests
        run: zig build test

      - name: Check consumer package contract
        working-directory: tests/consumer
        run: |
          zig build
          ./zig-out/bin/app
          ./zig-out/bin/native
