name: Package Impeller SDK

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Flutter release channel used when engine_sha is empty
        required: true
        default: stable
        type: choice
        options:
          - stable
          - beta
      engine_sha:
        description: Optional Flutter engine SHA. When set, channel is ignored
        required: false
        type: string
      release_tag:
        description: Optional release tag for SDK assets. Defaults to sdk-<engine-sha8>
        required: false
        type: string
      update_zon:
        description: Commit generated lazy dependencies back to this branch
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Package SDK assets
        id: package
        shell: bash
        run: |
          set -euo pipefail

          args=(
            --channel "${{ inputs.channel }}"
            --release-repository "${{ github.repository }}"
            --out-dir dist
            --metadata-out dist/sdk-metadata.json
          )

          if [[ -n "${{ inputs.engine_sha }}" ]]; then
            args+=(--sha "${{ inputs.engine_sha }}")
          fi

          if [[ -n "${{ inputs.release_tag }}" ]]; then
            args+=(--release-tag "${{ inputs.release_tag }}")
          fi

          if [[ "${{ inputs.update_zon }}" == "true" ]]; then
            args+=(--update-zon build.zig.zon)
          fi

          python3 tools/package_sdk.py "${args[@]}"

      - name: Publish SDK assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.package.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/*.tar.gz
            dist/lazy-deps.zigzon
            dist/sdk-metadata.json
          body: |
            Generated Impeller SDK packages for engine `${{ steps.package.outputs.engine_sha }}`.

            `lazy-deps.zigzon` contains the dependency entries generated for `build.zig.zon`.

      - name: Commit generated dependency entries
        if: ${{ inputs.update_zon }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add build.zig.zon
          if git diff --cached --quiet; then
            echo "No build.zig.zon changes to commit."
          else
            git commit -m "chore(sdk): update lazy sdk assets"
            git push
          fi
