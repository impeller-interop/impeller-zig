name: Update Impeller SDK

on:
  schedule:
    # Runs after impeller-sdk's daily packaging job.
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    name: Check for upstream SDK updates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Check and update Impeller SDK
        id: update
        shell: bash
        run: |
          set -euo pipefail

          repo="https://github.com/impeller-interop/impeller-sdk.git"
          latest_tag="$(git ls-remote --tags --refs "$repo" 'refs/tags/v*' | cut -d/ -f3 | sort -V | tail -1 || true)"

          if [ -z "$latest_tag" ]; then
            echo "::error::failed to resolve the latest impeller-sdk version tag"
            exit 1
          fi

          echo "latest=$latest_tag"
          zig fetch --save "git+https://github.com/impeller-interop/impeller-sdk#$latest_tag"

          if git diff --quiet -- build.zig.zon; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Impeller SDK is up to date."
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "tag=$latest_tag" >> "$GITHUB_OUTPUT"

      - name: Open pull request
        if: steps.update.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore: update impeller sdk"
          branch: "chore/update-impeller-sdk"
          title: "chore: update impeller sdk"
          body: |
            Updates the pinned Impeller SDK to the latest `${{ steps.update.outputs.tag }}` tag.
          delete-branch: true
